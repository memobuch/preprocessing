[project]
name = "memorbuch_preprocessing"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sebastian Schiller-Stoff", email = "sebastian.stoff@uni-graz.at" }
]
dependencies = [
    "pandas>=2.2.3",
    "rdflib==7.6.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/memorbuch_preprocessing"]

[project.scripts]
memor = "memorbuch_preprocessing.main:main"
